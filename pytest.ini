[pytest]
# `tests/` is on sys.path so the behavioural tests can `from conftest import ...`
# for the row builders, and `.` is on it so `dfsi` imports without installation.
testpaths = tests
pythonpath = . tests
markers =
    requires_memory: needs the built feature table (scripts/build_memory.sh)
    requires_model: needs a trained forecaster (scripts/train.sh)
